nt-family="monospace" font-size="14" font-weight="450" text-anchor="middle" opacity="1" letter-spacing="0">changed</text><rect x="1105" y="90" width="240" height="110" rx="3" stroke="#398bea" fill="rgba(22,42,65,.65)" stroke-width="2" opacity="0.85"/><text x="1225" y="150" fill="#f4f5f6" font-family="Arial" font-size="21" font-weight="600" text-anchor="middle" opacity="1" letter-spacing="0">SETTLEMENT</text><line x1="1225" y1="200" x2="1225" y2="260" stroke="#f0a83e" stroke-width="3" opacity="0.8"/><polygon points="1195,260 1255,260 1241,310 1209,310" stroke="#f0a83e" fill="rgba(240,168,62,.16)" stroke-width="2" opacity="0.9"/><rect x="1139" y="330" width="172" height="100" rx="3" stroke="#f0a83e" fill="rgba(90,50,10,.35)" stroke-width="1.5" opacity="0.7"/><text x="1225" y="465" fill="#f0a83e" font-family="monospace" font-size="14" font-weight="650" text-anchor="middle" opacity="1" letter-spacing="0">LEAK 4: COMPUTE WASTE</text><text x="1225" y="495" fill="#c9cdd2" font-family="monospace" font-size="14" font-weight="450" text-anchor="middle" opacity="1" letter-spacing="0">repeat builds, models,</text><text x="1225" y="515" fill="#c9cdd2" font-family="monospace" font-size="14" font-weight="450" text-anchor="middle" opacity="1" letter-spacing="0">environments</text>
